<div class="container-fluid">
  <h3>Add New Employee</h3>

  <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input formControlName="name" class="form-control" placeholder="Enter full name" />
      <div *ngIf="submitted && employeeForm.controls['name'].errors" class="text-danger">
        Name is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input formControlName="email" class="form-control" placeholder="Enter email address" />
      <div *ngIf="submitted && employeeForm.controls['email'].errors" class="text-danger">
        Valid email is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input formControlName="phone" class="form-control" placeholder="Enter phone" />
      <div *ngIf="submitted && employeeForm.controls['phone'].errors" class="text-danger">
        Phone is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Designation</label>
      <input formControlName="designation" class="form-control" placeholder="Enter designation" />
      <div *ngIf="submitted && employeeForm.controls['designation'].errors" class="text-danger">
        Designation is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Department</label>
      <input formControlName="department" class="form-control" placeholder="Enter department" />
      <div *ngIf="submitted && employeeForm.controls['department'].errors" class="text-danger">
        Department is required.
      </div>
    </div>

    <!-- Joining Date -->
    <div class="mb-3">
      <label class="form-label">Joining Date</label>
      <input formControlName="joiningDate" type="date" class="form-control" />
      <div *ngIf="submitted && employeeForm.controls['joiningDate'].errors" class="text-danger">
        Joining date is required.
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
